<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Designer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            display: grid;
            place-items: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
        }

        .card {
            background: white;
            padding: 2rem;
            margin-bottom: 1rem;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        h3 {
            margin-bottom: 0.5rem;
        }

        input,
        select {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        input[type="checkbox"] {
            width: auto;
            margin-bottom: 0;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn {
            margin-top: 0.75rem;
            background: transparent;
            color: #333;
            border: 1px solid #ccc;
        }

        .error {
            color: #c00;
            margin-top: 1rem;
            text-align: center;
        }

        .success {
            color: #087f23;
            margin-top: 1rem;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .file-input {
            padding: 1rem;
            border: 2px dashed #ccc;
            cursor: pointer;
        }

        img {
            width: 100%;
            margin-top: 1rem;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ================= AUTH ================= -->

    <div id="auth-page" class="card">

        <h1 id="auth-title">Login</h1>

        <form id="auth-form">

            <input
                id="username"
                type="text"
                placeholder="Username"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button id="auth-button" type="submit">
                Login
            </button>

        </form>

        <button
            id="toggle-auth"
            class="secondary-btn"
            type="button"
        >
            Need an account? Register
        </button>

        <p id="auth-message"></p>

    </div>


    <!-- ================= APPLICATION ================= -->

    <div id="app-page" class="hidden">

        <!-- ================= UPLOAD ================= -->

        <div id="upload-page" class="card">

            <h1>Upload Image</h1>

            <form id="upload-form">

                <input
                    id="thumbnail"
                    class="file-input"
                    type="file"
                    accept="image/png,image/jpeg,image/webp"
                    required
                >

                <button id="upload-button" type="submit">
                    Upload Image
                </button>

            </form>

            <p id="upload-message"></p>

            <img
                id="preview"
                class="hidden"
                alt="Uploaded image"
            >

            <button
                id="logout-button"
                class="secondary-btn"
                type="button"
            >
                Logout
            </button>

        </div>


        <!-- ================= TRANSFORM ================= -->

        <div id="transform-section" class="card">

            <h1>Transform Image</h1>

            <form id="transform-form">

                <input
                    id="image-id"
                    type="text"
                    placeholder="Image ID"
                    required
                >

                <h3>Resize</h3>

                <input
                    id="resize-width"
                    type="number"
                    min="1"
                    placeholder="Width"
                >

                <input
                    id="resize-height"
                    type="number"
                    min="1"
                    placeholder="Height"
                >

                <h3>Crop</h3>

                <input
                    id="crop-width"
                    type="number"
                    min="1"
                    placeholder="Width"
                >

                <input
                    id="crop-height"
                    type="number"
                    min="1"
                    placeholder="Height"
                >

                <input
                    id="crop-x"
                    type="number"
                    min="0"
                    placeholder="X"
                >

                <input
                    id="crop-y"
                    type="number"
                    min="0"
                    placeholder="Y"
                >

                <h3>Rotate</h3>

                <input
                    id="rotate"
                    type="number"
                    placeholder="Degrees (e.g. 90)"
                >

                <h3>Format</h3>

                <select id="format">
                    <option value="">Keep original</option>
                    <option value="jpg">JPEG</option>
                    <option value="png">PNG</option>
                    <option value="webp">WebP</option>
                </select>

                <h3>Filters</h3>

                <label>
                    <input
                        id="grayscale"
                        type="checkbox"
                    >
                    Grayscale
                </label>

                <label>
                    <input
                        id="sepia"
                        type="checkbox"
                    >
                    Sepia
                </label>

                <button
                    id="transform-button"
                    type="submit"
                >
                    Transform Image
                </button>

            </form>

            <p id="transform-message"></p>

            <img
                id="transformed-preview"
                class="hidden"
                alt="Transformed image"
            >

        </div>

    </div>

</div>

<script src="index.js"></script>

</body>
</html>
